# Security headers — included in the server block AND in every location that
# sets its own add_header. nginx drops inherited add_header directives as soon
# as a location defines any add_header of its own, so including this snippet
# everywhere is the only way to keep headers on every response.

add_header X-Frame-Options           "DENY"                 always;
add_header X-Content-Type-Options    "nosniff"              always;
# Legacy XSS auditor is deprecated and can introduce bugs; disable explicitly.
add_header X-XSS-Protection          "0"                    always;
add_header Referrer-Policy           "no-referrer"          always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), clipboard-read=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"         always;
add_header Cross-Origin-Resource-Policy "same-origin"       always;
# No 'unsafe-eval': Monaco is bundled locally (no AMD loader, no CDN).
# 'unsafe-inline' styles are required by Monaco's dynamic styling.
# worker-src 'self': Monaco + detection workers are same-origin files.
# connect-src 'self': the app never talks to any other host.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
